<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PRODUCTO ACREDITABLE · Matemática I</title>
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
  <main class="panel">
    <header class="cabecera">
      <p class="institucion">Universidad San Ignacio de Loyola · Matemática I · PC2 2026-II</p>
      <h1>PRODUCTO ACREDITABLE</h1>
      <p class="subtitulo">Selecciona un taller para resolverlo paso a paso</p>
    </header>

    <section id="vista-tarjetas" class="tarjetas" aria-label="Talleres disponibles"></section>

    <section id="vista-taller" class="vista-taller" hidden>
      <div class="barra-taller">
        <button id="btn-volver" class="boton" type="button">&#9664; Volver al panel</button>
        <span id="taller-nombre" class="taller-nombre"></span>
      </div>
      <iframe id="iframe-taller" class="iframe-taller" title="Taller" loading="lazy"></iframe>
    </section>
  </main>

  <script src="js/datos.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
